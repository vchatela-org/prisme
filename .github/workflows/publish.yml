name: publish

# Push the images to GHCR.
#
# Tags only. A push to `main` builds and scans (`images.yml`) but publishes
# nothing: what runs in the cluster should be a deliberate, named version rather
# than whatever merged last. `workflow_dispatch` is there for a re-push after a
# registry problem.
#
# ── Why the runner is GitHub-hosted ──────────────────────────────────────────
# This repository is public. The organisation's self-hosted runners carry a token
# that can read cluster secrets, and no longer accept public repositories, so the
# build runs on GitHub-hosted `ubuntu-latest`: free for public repositories, and
# with no cluster identity of its own. GHCR is reachable from there; Harbor — an
# internal host — was not, which is what the old `kubernetes` BuildKit driver and
# the self-hosted runner existed to work around.
#
# ── Why this does not call the shared reusable workflow ──────────────────────
# `vchatela-org/shared-workflows/.github/workflows/docker-build-push-ghcr.yml@v1`
# is the org's GHCR build-and-push path, but it builds one image from `context: .`
# and has no input for the Dockerfile path or the build target, so it cannot build
# a monorepo that ships two Dockerfiles both needing the repository root as their
# context. Rather than contort the images to fit it, this repository publishes
# directly; the spec is corrected to say so in docs/15-runtime.md §1. Moving back
# is a one-line change once that workflow grows a `dockerfile_path` input.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish
    # Only here: a fork has neither the token nor the package.
    if: github.repository == 'vchatela-org/prisme'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # prisme-api and prisme-sync are one build (docs/15-runtime.md §1).
          # Only this image is published; the CronJob runs it with a different
          # command, which is what makes the scheduled pass and the force-sync
          # button provably one code path.
          - image: prisme-api
            dockerfile: apps/api/Dockerfile
          - image: prisme-web
            dockerfile: apps/web/Dockerfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A GitHub-hosted runner has a Docker daemon, so the default buildx driver
      # works; the `kubernetes` driver the self-hosted runner needed is gone with
      # the runner.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # docs/15-runtime.md §1: "SBOM and provenance attestation emitted at
          # build." They can only be attached to an image that is pushed, which
          # is why `images.yml` does not emit them.
          sbom: true
          provenance: mode=max

      # Scans the pushed image by digest, not by tag: the digest is what the
      # deployment pins, and it cannot be moved under the scan.
      - name: Trivy — vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret
          exit-code: '1'

      - name: Trivy — Dockerfile misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Record the digest
        run: |
          echo "### ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags: \`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
