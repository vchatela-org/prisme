name: privacy

# This repository is public: it documents a product, never its owner.
# See docs/17-privacy.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  denylist:
    name: privacy deny-list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the history scan needs every blob

      - name: Materialise the local deny-list supplement
        # The supplement holds the instance's own vocabulary, so it cannot be
        # committed — it is gitignored — and that left this job blind to exactly
        # the class it exists for. A real area name passed the public patterns and
        # only an operator's machine could see it. It comes from a repository
        # secret instead, so CI runs the same patterns without publishing them.
        #
        # Fork pull requests receive no secrets, which is why the missing-supplement
        # case is a warning here and a hard failure on `main` below: a pull request
        # still gets a truthful report of what it did and did not cover, while the
        # branch that everything merges into never runs blind.
        env:
          SUPPLEMENT: ${{ secrets.PRIVACY_DENYLIST_LOCAL }}
        run: |
          if [[ -n "$SUPPLEMENT" ]]; then
            printf '%s\n' "$SUPPLEMENT" > .github/privacy-denylist.local.txt
            echo "local supplement: present"
          else
            echo "::warning title=Partial privacy scan::PRIVACY_DENYLIST_LOCAL is unset (fork PR?), so this run covers the public patterns only."
          fi

      - name: The scan must not run blind on main
        if: github.event_name != 'pull_request'
        run: |
          if [[ ! -s .github/privacy-denylist.local.txt ]]; then
            echo "::error::PRIVACY_DENYLIST_LOCAL is unset — the deny-list scan would report 'clean' with half its patterns missing."
            exit 1
          fi

      - name: Scan working tree
        # `--redact-hits`: on a public run the matched content IS the leak, and a
        # gate that prints it publishes what it exists to prevent.
        run: ./scripts/privacy-scan.sh --redact-hits

      - name: Scan full history
        # History is permanent on a public repository, so a clean working tree
        # is not enough — a leak three commits back is still a leak.
        run: ./scripts/privacy-scan.sh --history --redact-hits

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The official gitleaks ACTION refuses to run for organization accounts
      # without a paid licence key, so it had never once succeeded here. The
      # scanner itself is free: run the binary and skip the wrapper.
      # Pinned deliberately — Dependabot does not watch this, so bump it by hand.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full history
        run: gitleaks detect --redact --no-banner --exit-code 1

  selftest:
    name: security gate self-test
    runs-on: ubuntu-latest

    # Negative controls for the two jobs above (W14 item 9).
    #
    # W00 watched both gates fail by hand, once, and recorded it. That was right
    # and it does not survive contact with time: a `paths:` filter, a renamed
    # file, a deny-list emptied by a bad merge, a scanner that starts exiting 0
    # on a parse error — every one of those turns a gate into decoration, and
    # every one of them looks exactly like a passing build.
    #
    # So the "watched fail" is a job rather than a memory. It plants a generated
    # UUID and a generated high-entropy credential in a throwaway worktree and
    # fails if either scanner accepts them — and fails, too, if a clean tree is
    # *rejected*, because a deny-list that refuses everything is not a working
    # deny-list either.
    #
    # Nothing offending is ever committed: the content is generated at run time
    # and the worktree is removed whatever happens.
    steps:
      - uses: actions/checkout@v7

      - name: Install gitleaks
        env:
          # Kept in step with the `gitleaks` job above. Dependabot does not watch
          # this, so both move by hand, together.
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Both gates must refuse what they exist to refuse
        run: ./scripts/security-gates-selftest.sh
