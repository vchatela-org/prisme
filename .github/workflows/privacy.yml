name: privacy

# This repository is public: it documents a product, never its owner.
# See docs/17-privacy.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  denylist:
    name: privacy deny-list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the history scan needs every blob

      - name: Scan working tree
        run: ./scripts/privacy-scan.sh

      - name: Scan full history
        # History is permanent on a public repository, so a clean working tree
        # is not enough — a leak three commits back is still a leak.
        run: ./scripts/privacy-scan.sh --history

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
