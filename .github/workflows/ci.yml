name: ci

# Typecheck, lint, test, build and the dependency audit.
#
# One job per check, deliberately. A single "ci" job would report one status,
# and a reviewer reading the pull request would see "ci failed" rather than
# "the tests failed" — the pull request template asks for every check by name
# and result, and that is only honest if the checks have names.
#
# Each of these becomes a required status check from the commit that adds it
# (docs/40-workstreams/README.md#checks). Never relax one to get green.
#
# Third-party actions are pinned by commit SHA with the version in a comment, on
# CodeQL's advice: a tag is mutable, so `@v6` is a promise from a repository
# nobody here controls. GitHub-owned actions are exempt because their tags are
# immutable. Dependabot updates a SHA pin like any other dependency.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # `pnpm install` must not reach for anything the lockfile does not name.
  CI: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type-aware linting needs the workspace packages' declarations, which
      # resolve through each package's `exports` entry the same way the apps
      # resolve them at runtime. Without this, every cross-package type is
      # `any` and the rules that matter most quietly stop applying.
      #
      # `apps/sync` is in the list because it is a library as well as a binary:
      # the API's `POST /sync` imports `@prisme/sync` (docs/16-sync.md §7). With
      # its declarations missing, every value crossing that import is an error
      # type and the `no-unsafe-*` rules fire on code that is in fact typed —
      # which is how this was found.
      #
      # `apps/api` is deliberately *not* in the list. W14 briefly put it there,
      # because the web middleware imported the assertion verifier from it and
      # `lint` failed on thirteen `no-unsafe-*` errors in correctly typed code.
      # That was the wrong fix for a real problem: a `workspace:*` edge from
      # `@prisme/web` to `@prisme/api` also drags the Postgres driver, Hono and
      # a native Argon2 binding into the web image, and the web tier holds no
      # database credential by design (docs/14-threat-model.md §2). The verifier
      # moved to `@prisme/auth` instead, and the glob above covers it.
      - run: pnpm -r --filter "./packages/*" --filter "./apps/sync" run build
      # ESLint carries two rules that are contract rather than style:
      # packages/domain is pure, and SQL is never built from strings.
      - run: pnpm lint

  test:
    name: test
    runs-on: ubuntu-latest

    # A real PostgreSQL, because the API's integration tests need one (W05).
    # The failures that layer actually has are the ones a fake cannot have — a
    # `numeric` arriving as a string, a `jsonb` column arriving as text, a date
    # landing on the wrong side of local midnight, a constraint the application
    # thought it had already checked. Every one of those is invisible to a type
    # checker, and two of them were found exactly this way.
    #
    # Same image and major version as docker-compose.yml, so local and CI agree.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: prisme
          POSTGRES_PASSWORD: prisme
          POSTGRES_DB: prisme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisme -d prisme"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # One role here rather than the DML/DDL split docker-compose sets up: a
      # service container has no init scripts. The split is exercised locally
      # and asserted in the `images` workflow; the point of this database is the
      # driver and the schema.
      PRISME_TEST_DATABASE_URL: postgres://prisme:prisme@127.0.0.1:5432/prisme

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The packages are built first: several tests import a workspace package
      # through its published entry point, which is what the apps do too.
      # `apps/sync` too — the API imports it as a library.
      - run: pnpm -r --filter "./packages/*" --filter "./apps/sync" run build

      # The database-backed suites skip themselves when this is unset, and a
      # suite that skips silently in CI is a suite that has stopped running. If
      # the service ever disappears, this step fails instead of the tests
      # quietly thinning out.
      - name: The integration database must be present, not optional
        run: test -n "$PRISME_TEST_DATABASE_URL"

      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # A build that rewrites a tracked file is a build nobody can reproduce —
      # `next build` will happily edit tsconfig.json, for instance.
      - name: The working tree must be unchanged by the build
        run: git diff --exit-code

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `moderate` rather than `high`: this application holds API tokens to the
      # owner's entire planning workspace (docs/14-threat-model.md §1), and the
      # dependency surface is small enough that a moderate advisory is worth
      # reading rather than batching.
      - run: pnpm audit --audit-level=moderate

  golden:
    name: golden fixtures
    runs-on: ubuntu-latest
    steps:
      # The whole history, because this check is a comparison: it needs the base
      # commit's copy of every golden file, not just the working tree's.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A golden file pins what a scoring method computes. Changing it without
      # bumping `version` makes every stored score unattributable, and nothing
      # about that failure is visible at the time it happens — ADR-0006, and
      # W01's definition of done.
      - name: Golden fixtures move with their method version
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}
        run: ./scripts/check-golden-fixtures.py "$BASE"
