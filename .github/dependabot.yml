version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR per ecosystem area keeps the review burden sane on a
      # single-maintainer project. Security updates are never grouped —
      # they open individually so they are not delayed behind a noisy group.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # /apps/sync has no Dockerfile, and that is the design rather than an
  # omission: prisme-api and prisme-sync are one build (docs/15-runtime.md §1),
  # so apps/api/Dockerfile produces both and the CronJob overrides the command.
  # Listing a directory with no manifest only produces a Dependabot error.
  - package-ecosystem: docker
    directories:
      - /apps/web
      - /apps/api
    schedule:
      interval: weekly
